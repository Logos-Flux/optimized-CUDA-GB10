version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "ci"
    labels:
      - "ci"
      - "dependencies"

  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "build"
    labels:
      - "build"
      - "dependencies"
    # NGC base images are pinned intentionally to a known-good tag
    # (see README "Why NGC?"). Open PRs but require manual review.
    open-pull-requests-limit: 5
